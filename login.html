<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | My App</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    h2 { margin-top: 0; color: #38bdf8; text-align: center; }
    label { font-size: 0.9rem; color: #94a3b8; display: block; margin-top: 15px; }
    input { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
    .btn { width: 100%; background: #0284c7; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; margin-top: 20px; cursor: pointer; }
    .footer-text { text-align: center; margin-top: 15px; font-size: 0.85rem; color: #94a3b8; }
    .footer-text a { color: #38bdf8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Account Login</h2>
    <form action="lobby.html">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter username" required>
      
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" required>
      
      <button type="submit" class="btn">Sign In</button>
    </form>
    <p class="footer-text">Back to <a href="landing.html">Landing Page</a></p>
  </div>
</body>
</html>
